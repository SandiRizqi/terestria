plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // id 'com.chaquo.python'  // Chaquopy - Not used anymore
}

android {
    namespace = "io.github.sandirizqi.terestria"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "io.github.sandirizqi.terestria"
        minSdk = 24
        targetSdk = 35
        // Version akan otomatis diambil dari pubspec.yaml oleh Flutter
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
        
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        } 
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            def versionName = variant.versionName

            if (buildType == 'release') {
                outputFileName = "Terestria-v${versionName}-release.apk"
            } else {
                outputFileName = "Terestria-v${versionName}-debug.apk"
            }
        }
    }

    // GraphHopper 7.0 pulls in jakarta.* transitive deps that duplicate
    // META-INF/LICENSE.md — exclude the conflicting resources.
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md',
                         'META-INF/LICENSE', 'META-INF/NOTICE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // GraphHopper offline routing engine
    // 9.1 uses Stream.toList() (Java 16) which is unsupported on Android <API34.
    // 7.0 is compiled against Java 11 — no such issue.
    implementation('com.graphhopper:graphhopper-core:7.0') {
        exclude group: 'org.locationtech.jts'
    }
    implementation 'org.locationtech.jts:jts-core:1.19.0'
}

flutter {
    source = "../.."
}
